name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }}${{ matrix.streaming && ', streaming' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        streaming: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ALSA headers
        if: runner.os == 'Linux' && matrix.streaming
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: streaming-${{ matrix.streaming }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets ${{ matrix.streaming && '--features streaming' || '' }} -- -D warnings
      - name: Test
        run: cargo test --locked --workspace ${{ matrix.streaming && '--features streaming' || '' }}

  msrv:
    name: Minimum Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked --workspace --all-targets --features streaming

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Reports, and deliberately does not block. Every advisory against this
  # tree today is inside librespot's dependencies, with no newer librespot
  # to move to -- so a blocking check would fail every run for problems
  # nobody here can fix, and a CI that is always red stops being read. It
  # is here to catch the next one, especially in a dependency we chose.
  # See SECURITY.md. Make it blocking once the librespot subtree is clear.
  advisories:
    name: Security advisories (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
