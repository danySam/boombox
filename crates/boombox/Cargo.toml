[package]
name = "boombox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Embed librespot so the daemon becomes a Spotify Connect device that decodes
# and plays audio itself, rather than only driving other devices.
streaming = ["dep:librespot", "dep:rustfft", "dep:sysinfo"]

[[bin]]
name = "boombox"
path = "src/main.rs"

[dependencies]
libc.workspace = true
boombox-core.workspace = true
boombox-ipc.workspace = true
boombox-tui.workspace = true

librespot = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
open.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
