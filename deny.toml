# Which dependency licences are acceptable. `cargo deny check licenses` runs in CI.

[graph]
all-features = true

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.9

# webpki 0.22 publishes no licence field. Its LICENSE file is the ISC licence
# behind a short preamble, which keeps cargo-deny's own match below its
# threshold. The hash is cargo-deny's, as it reports for that file.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
