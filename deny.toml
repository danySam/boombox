# Dependency licences and security advisories. Both run in CI.

[graph]
all-features = true

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.9

# webpki 0.22 publishes no licence field. Its LICENSE file is the ISC licence
# behind a short preamble, which keeps cargo-deny's own match below its
# threshold. The hash is cargo-deny's, as it reports for that file.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# Advisories against librespot's dependency tree, every one of them
# upstream. None are reachable through boombox's own dependencies, none
# can be configured away -- hyper-proxy2 is required by every TLS option
# librespot offers -- and librespot 0.8.0 is its latest release. They are
# listed rather than tolerated silently: with them named, a *new*
# advisory fails the build, which is the point of running the check at
# all. Revisit when librespot moves to the current rustls generation, and
# delete whatever no longer appears. See SECURITY.md.
[advisories]
ignore = [
    # quick-xml, via librespot-core: denial of service while parsing.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml, pinned by librespot-core" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml, pinned by librespot-core" },
    # rsa, via librespot-core. No fixed version has ever been published.
    { id = "RUSTSEC-2023-0071", reason = "rsa, pinned by librespot-core; no fix exists upstream" },
    # rustls-pemfile, via hyper-proxy2 -> librespot-core.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, reached via hyper-proxy2" },
    # The rustls 0.22 generation, via hyper-proxy2 -> librespot-core. Our
    # own path already uses the current rustls and webpki.
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.22, reached via hyper-proxy2" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102, reached via hyper-proxy2" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102, reached via hyper-proxy2" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102, reached via hyper-proxy2" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102, reached via hyper-proxy2" },
]
